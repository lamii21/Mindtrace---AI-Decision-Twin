name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "schema/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "schema/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Architecture / import boundaries
        run: lint-imports --config .importlinter

      - name: Tests (with coverage)
        # tests/golden/test_schema_snapshot.py fails here if schema/*.yaml drifted from the
        # committed snapshot without a deliberate `make golden-update` + review.
        run: pytest --cov --cov-report=term-missing --cov-report=xml
