# Local dev infrastructure. Not used by M1 (no persistence, no queue yet) - this
# is the M4/M10 target, brought up now so `docker compose up` is a stable habit
# from day one. `docker compose --profile m1 up` starts nothing extra; the
# services below simply aren't required until the milestone that uses them.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mindtrace
      POSTGRES_PASSWORD: mindtrace
      POSTGRES_DB: mindtrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindtrace"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
