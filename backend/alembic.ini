[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
# No `sqlalchemy.url` here - env.py reads it from Settings.database_url
# (MINDTRACE_DATABASE_URL), never a hardcoded connection string
# (M6-Persistence/Foundation planning s4). Revision files live in the
# conventional migrations/versions/ (not flat migrations/) - Alembic's
# revision scanner otherwise tries to load env.py/script.py.mako themselves
# as version scripts when version_locations == script_location.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
